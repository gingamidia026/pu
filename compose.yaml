name: enem
services:
  # Chave dos resumos da tabela limites (achado N8): criada na primeira subida em .segredos/limites/chave
  # (fora do git, da imagem e das cópias do banco), permissão 600, dona o usuário 10001 da aplicação; depois só é lida.
  # No Docker sem root, o root deste contêiner é o usuário do PC; ele só cria a pasta, a chave e passa a dona.
  chave-limites:
    image: python:3.13-slim
    user: '0:0'
    command: [python, -c, "import os, secrets, pathlib; d = pathlib.Path('/segredos'); d.chmod(0o711); c = d / 'chave'\nif not c.exists():\n    f = os.open(c, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600); os.write(f, secrets.token_hex(32).encode()); os.close(f); os.chown(c, 10001, 10001)"]
    volumes:
      - ./.segredos/limites:/segredos
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: 'no'
  aplicacao:
    build: .
    environment:
      ORIGEM: ${ORIGEM:-http://localhost:8088}
      CATALOGO: /catalogo/atual.json
      AMBIENTES_INDIVIDUAIS: '1'
      PERFIL_TESTE: ${PERFIL_TESTE:-0}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-0}
      CHAVE_LIMITES: /segredos/chave
    volumes:
      - estudos:/dados
      - ./.segredos/gerenciador:/controle:ro
      - ./.segredos/limites:/segredos:ro
      - ./.catalogo:/catalogo:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    networks: [interna]
    depends_on:
      chave-limites:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saude')"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [interna, externa]
    depends_on:
      aplicacao:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  interna:
    internal: true
  externa:
volumes:
  estudos:
